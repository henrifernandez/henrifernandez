<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 220" width="830" height="220" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Henrique, estudante e desenvolvedor</title>
<style>
.ring{fill:none;stroke:#25D0C0;stroke-width:2}
.name{font:700 46px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F2F7FB}
.sub{font:500 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9FB3C8}
.type{font:500 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#25D0C0}
@keyframes r1{0%{width:0;animation-timing-function:steps(23,end)}18%{width:304px}30%{width:304px}33%{width:0}100%{width:0}}
@keyframes r2{0%{width:0;animation-timing-function:steps(21,end)}18%{width:277px}30%{width:277px}33%{width:0}100%{width:0}}
@keyframes r3{0%{width:0;animation-timing-function:steps(24,end)}18%{width:317px}30%{width:317px}33%{width:0}100%{width:0}}
.r1{width:0;animation:r1 12s infinite;animation-delay:0s}
.r2{width:0;animation:r2 12s infinite;animation-delay:4s}
.r3{width:0;animation:r3 12s infinite;animation-delay:8s}
@media (prefers-reduced-motion:reduce){.r1{animation:none;width:304px}.r2,.r3{animation:none}}
</style>
<defs><clipPath id="c1"><rect class="r1" x="290" y="150" height="36"/></clipPath>
<clipPath id="c2"><rect class="r2" x="290" y="150" height="36"/></clipPath>
<clipPath id="c3"><rect class="r3" x="290" y="150" height="36"/></clipPath>
