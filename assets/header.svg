<rect width="830" height="220" rx="14" fill="#0B1F33"/>
<circle cx="150" cy="110" r="92" fill="none" stroke="#25D0C0" stroke-opacity=".12"/>
<circle class="ring" cx="150" cy="110" r="8" opacity="0">
<animate attributeName="r" values="8;92" dur="3s" begin="0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.85;0" dur="3s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle class="ring" cx="150" cy="110" r="8" opacity="0">
